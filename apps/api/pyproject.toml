[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliotecario-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3",
  "argon2-cffi>=23.1,<26", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "pymupdf>=1.26,<2", "pymupdf4llm>=0.0.27,<1", "python-docx>=1.2,<2",
  "markdown-it-py>=4,<5", "defusedxml>=0.7,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["bibliotecario*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
